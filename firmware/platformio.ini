; Compile-only starting point. Confirm the exact ESP32 board before any upload.
[platformio]
default_envs = esp32-scaffold

[env:esp32-scaffold]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@6.21.5
build_flags = -Wall -Wextra

; Explicit opt-in compile target only. Do not upload until wiring is verified.
[env:esp32-sensors-verified]
extends = env:esp32-scaffold
build_flags =
    ${env:esp32-scaffold.build_flags}
    -DNASEEM_VERIFIED_WIRING=1
    -DNASEEM_ENABLE_PMS7003=1
    -DNASEEM_ENABLE_BME280=1
    -DNASEEM_ENABLE_SGP30=1
lib_deps =
    ${env:esp32-scaffold.lib_deps}
    adafruit/Adafruit BME280 Library@2.2.4
    adafruit/Adafruit SGP30 Sensor@2.0.3

; Stage 1: only BME280 and its I2C bus are initialized.
[env:esp32-bme-verified]
extends = env:esp32-scaffold
build_flags = ${env:esp32-scaffold.build_flags} -DNASEEM_VERIFIED_WIRING=1 -DNASEEM_ENABLE_BME280=1
lib_deps =
    ${env:esp32-scaffold.lib_deps}
    adafruit/Adafruit BME280 Library@2.2.4

; Stage 2: BME280 plus PMS7003; SGP30 remains disabled.
[env:esp32-bme-pms-verified]
extends = env:esp32-bme-verified
build_flags = ${env:esp32-bme-verified.build_flags} -DNASEEM_ENABLE_PMS7003=1
