[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "naseem-prototype"
version = "0.3.0"
description = "Local academic indoor-air indicator prototype, not a safety instrument"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5,<4"]

[project.scripts]
naseem = "naseem.cli:main"

[tool.setuptools.packages.find]
include = ["naseem*"]
